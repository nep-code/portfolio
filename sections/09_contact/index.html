<section id="contact" class="section rel dark">

    <div id="contact-bg" class="ctr unclick">
        <canvas id="contact-bg-canvas"></canvas>
    </div>

    <header>
        <h1>
            <div data-svg="src/icon.svg"></div>
            <span>CONTACT</span>
        </h1>
        <p>Let’s make something worth <strong>clicking</strong>.</p>
    </header>

    <div id="contact-form" class="rel">
        <form method="POST" action="https://formspree.io/f/mrgvjzra">
            <input type="hidden" name="_subject" value="Contact request from nep-code/portfolio" />
            <input type="email" name="_replyto" placeholder="Your email" required>
            <textarea name="message" placeholder="Your message" required></textarea>
            <button type="submit">Send</button>
        </form>
    </div>
</section>
